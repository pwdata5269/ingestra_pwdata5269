name: supabase-schema-test

on:
  workflow_dispatch:

jobs:
  ensure-project:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    outputs:
      supabase_project_ref: ${{ steps.ensure_supabase.outputs.supabase_project_ref }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate Supabase project bootstrap contract
        shell: pwsh
        run: |
          .\scripts\Test-BootstrapPrereqs.ps1 -Profile supabase-project

      - name: Ensure Supabase project
        id: ensure_supabase
        shell: pwsh
        run: |
          .\scripts\providers\Supabase.ps1 `
            -Action EnsureProject `
            -ConfigPath .\config\automation-config.json

      - name: Write schema handoff summary
        shell: pwsh
        run: |
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @"
          ## Supabase Schema Handoff
          - Project ref: ${{ steps.ensure_supabase.outputs.supabase_project_ref }}
          - Next step: confirm or add the `SUPABASE_DB_URL` repository secret.
          - Accepted format: `postgresql://postgres.${{ steps.ensure_supabase.outputs.supabase_project_ref }}:[PASSWORD]@aws-0-eu-west-1.pooler.supabase.com:5432/postgres`
          - After the secret is in place, approve the `supabase-schema-ready` environment to continue.
          "@

  ensure-schema:
    needs: ensure-project
    runs-on: ubuntu-latest
    environment: supabase-schema-ready
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate Supabase schema bootstrap contract
        shell: pwsh
        run: |
          .\scripts\Test-BootstrapPrereqs.ps1 -Profile supabase-schema

      - name: Install PostgreSQL client
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Supabase schema
        shell: pwsh
        run: |
          .\scripts\providers\Supabase.ps1 `
            -Action EnsureSchema `
            -ProjectRef "${{ needs.ensure-project.outputs.supabase_project_ref }}" `
            -ConfigPath .\config\automation-config.json
