name: provision-test

on:
  workflow_dispatch:
    inputs:
      pinecone_index_name:
        description: Pinecone index name
        required: true
        default: ingestra-ci
      pinecone_dimension:
        description: Embedding dimension
        required: true
        default: "1024"
      run_smoke_tests:
        description: Run smoke tests after provisioning
        required: true
        type: boolean
        default: false

jobs:
  provision:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_ORG_SLUG: ${{ secrets.SUPABASE_ORG_SLUG }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      INGESTRA_UPLOAD_URL: ${{ secrets.INGESTRA_UPLOAD_URL }}
      INGESTRA_SEARCH_URL: ${{ secrets.INGESTRA_SEARCH_URL }}
      INGESTRA_CHAT_URL: ${{ secrets.INGESTRA_CHAT_URL }}

    steps:
      - uses: actions/checkout@v6

      - name: Validate provision bootstrap contract
        shell: pwsh
        run: |
          .\scripts\Test-BootstrapPrereqs.ps1 -Profile provision

      - name: Ensure Supabase project
        id: ensure_supabase
        shell: pwsh
        run: |
          .\scripts\providers\Supabase.ps1 `
            -Action EnsureProject `
            -ConfigPath .\config\automation-config.json

      - name: Ensure Azure Supabase login app
        id: ensure_azure_login_app
        shell: pwsh
        run: |
          .\scripts\providers\Azure.ps1 `
            -Action EnsureSupabaseLoginApp `
            -ConfigPath .\config\automation-config.json

      - name: Ensure Supabase Azure auth config
        shell: pwsh
        run: |
          .\scripts\providers\Supabase.ps1 `
            -Action EnsureAzureAuthConfig `
            -ProjectRef "${{ steps.ensure_supabase.outputs.supabase_project_ref }}" `
            -AzureClientId "${{ steps.ensure_azure_login_app.outputs.supabase_login_app_id }}" `
            -AzureClientSecret "${{ steps.ensure_azure_login_app.outputs.supabase_login_client_secret }}" `
            -ConfigPath .\config\automation-config.json

      - name: Ensure Pinecone index
        shell: pwsh
        run: |
          .\scripts\providers\Pinecone.ps1 `
            -Action EnsureIndex `
            -IndexName "${{ inputs.pinecone_index_name }}" `
            -Dimension ${{ inputs.pinecone_dimension }} `
            -Metric cosine `
            -Cloud aws `
            -Region us-east-1

      - name: Ensure Vercel project
        shell: pwsh
        run: |
          .\scripts\providers\Vercel.ps1 `
            -Action EnsureProject `
            -ConfigPath .\config\automation-config.json

      - name: Ensure Vercel project link
        shell: pwsh
        run: |
          .\scripts\providers\Vercel.ps1 `
            -Action EnsureProjectLink `
            -ConfigPath .\config\automation-config.json

      - name: Validate smoke-test bootstrap contract
        if: ${{ inputs.run_smoke_tests }}
        shell: pwsh
        run: |
          .\scripts\Test-BootstrapPrereqs.ps1 -Profile smoke

      - name: Run smoke tests
        if: ${{ inputs.run_smoke_tests }}
        shell: pwsh
        run: |
          .\scripts\Invoke-IngestraSmokeTests.ps1
