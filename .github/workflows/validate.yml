name: validate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  pester:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set report timestamp
        shell: pwsh
        run: |
          $timestamp = (Get-Date).ToUniversalTime().ToString("yyyyMMdd-HHmmssZ")
          "REPORT_TIMESTAMP=$timestamp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.6.0
          $reportDir = Join-Path $PWD 'reports\pester'
          $xmlPath = Join-Path $reportDir "pester-$env:REPORT_TIMESTAMP.xml"
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null

          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests'
          $config.Run.PassThru = $true
          $config.Output.Verbosity = 'Detailed'
          $config.Output.CIFormat = 'GithubActions'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = $xmlPath

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) {
            throw "Pester reported $($result.FailedCount) failed test(s)."
          }

      - name: Build HTML test report
        if: always()
        shell: pwsh
        run: |
          $reportDir = Join-Path $PWD 'reports\pester'
          $xmlPath = Join-Path $reportDir "pester-$env:REPORT_TIMESTAMP.xml"
          $htmlPath = Join-Path $reportDir "pester-$env:REPORT_TIMESTAMP.html"
          $generatedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss 'UTC'")

          .\scripts\New-PesterHtmlReport.ps1 `
            -InputXmlPath $xmlPath `
            -OutputHtmlPath $htmlPath `
            -ReportTitle "Validate Workflow Pester Report" `
            -GeneratedAt $generatedAt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-report-${{ env.REPORT_TIMESTAMP }}
          path: reports/pester/
          if-no-files-found: error

      - name: Validate minimal bootstrap profile
        shell: pwsh
        run: |
          .\scripts\Test-BootstrapPrereqs.ps1 -Profile minimal
